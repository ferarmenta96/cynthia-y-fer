<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurador de trabajo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <header>
      <h1>Configurador de costos</h1>
      <p>Define dimensiones, material y proceso y obtén el costo estimado.</p>
    </header>
    <main id="app" class="card">
      <div id="stepper" class="stepper"></div>
      <div id="content"></div>
      <div class="actions">
        <button id="prev" class="ghost">Anterior</button>
        <button id="next">Siguiente</button>
      </div>
    </main>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
